<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VR Golf · Driving Range</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd8ee; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 16px; top: 16px; max-width: 360px; padding: 16px 18px;
        background: rgba(14, 20, 28, 0.86); color: #eef3f7; border-radius: 14px; line-height: 1.4;
      }
      #hud h1 { margin: 0 0 4px; font-size: 22px; }
      #hud p { margin: 6px 0; font-size: 14px; color: #b8c7d6; }
      #enter-vr {
        width: 100%; margin: 10px 0 4px; padding: 14px; font-size: 20px; font-weight: 700;
        border: 0; border-radius: 10px; background: #2e7d32; color: white; cursor: pointer;
      }
      #enter-vr:disabled { background: #455a64; cursor: default; }
      details { margin-top: 10px; font-size: 14px; }
      summary { cursor: pointer; color: #ffd54f; }
      label { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; }
      label output { text-align: right; font-variant-numeric: tabular-nums; }
      #swing { margin-top: 6px; padding: 8px 14px; border: 0; border-radius: 8px; background: #1565c0; color: #fff; font-weight: 700; cursor: pointer; }
      .keys { font-size: 13px; color: #90a4ae; }
      body.in-xr #hud { display: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="hud">
      <h1>VR Golf · Driving Range</h1>
      <p>Hold the club in one controller and swing for real. Physics, terrain and art are all generated in code.</p>
      <button id="enter-vr" disabled>Checking VR…</button>
      <p id="vr-note"></p>
      <details>
        <summary>Desktop test swing</summary>
        <label>Speed <input id="speed" type="range" min="40" max="120" value="85" oninput="this.nextElementSibling.value=this.value" /><output>85</output></label>
        <label>Face <input id="face" type="range" min="-10" max="10" step="0.5" value="0" oninput="this.nextElementSibling.value=this.value" /><output>0</output></label>
        <label>Path <input id="path" type="range" min="-10" max="10" step="0.5" value="0" oninput="this.nextElementSibling.value=this.value" /><output>0</output></label>
        <label>Attack <input id="attack" type="range" min="-8" max="6" step="0.5" value="-3" oninput="this.nextElementSibling.value=this.value" /><output>-3</output></label>
        <button id="swing">Swing (Space)</button>
        <p class="keys">← → change club · A assist · W wind · R re-tee · drag to look</p>
      </details>
      <p class="keys" id="version"></p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
